# Serves the built app and passes /api on to the API container, so both share one origin.

server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx doesn't know the PWA manifest, and a phone may not offer to install the app without its type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The API, without its /api prefix: /api/products reaches the API as /products.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme a reverse proxy in front already set, so the API builds https links behind TLS.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # File names under assets/ change with their content, so they can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page and the service worker must be checked on every load, or an update never reaches the device.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Every other path is a screen of the app (/products/123), which the app itself routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The scheme the client used: from a reverse proxy in front when there is one, otherwise this connection's.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
