# Runs the API with its PostgreSQL database. Copy .env.example to .env, fill it in, then: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d store"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # TLS is expected to end at a reverse proxy, which passes the original scheme and host in X-Forwarded-* headers.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__MainDb: >-
        Host=db;Port=5432;Database=store;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__ValidIssuer: ${JWT_ISSUER:-store-management}
      Jwt__ValidAudiences__0: ${JWT_AUDIENCE:-store-management}
      Jwt__ExpirationInMinutes: ${JWT_EXPIRATION_MINUTES:-720}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
      InitialUser__Email: ${INITIAL_USER_EMAIL:-}
      InitialUser__Password: ${INITIAL_USER_PASSWORD:-}
      InitialUser__FirstName: ${INITIAL_USER_FIRST_NAME:-Owner}

volumes:
  db-data:
